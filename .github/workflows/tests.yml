name: tests

on:
  push:
    branches: [main]
  pull_request:

# 同分支新推送自动取消还在跑的旧任务，省额度也更快出结果。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest 已不再提供 Python 3.8，固定到 22.04 保留 3.8 覆盖。
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          # 核心 job 零第三方依赖，不启用 pip 缓存（无缓存目录反而报错）。

      # 项目核心零第三方依赖，无需 pip install。
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  # 可选 HTTP API：单独安装依赖后在受支持的 Python 版本上验证接口。
  api:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install optional API dependencies
        run: python -m pip install "fastapi>=0.100" "uvicorn>=0.20" "httpx>=0.24"

      - name: Run tests (core + API)
        run: python -m unittest discover -s tests -v

  # 静态检查：宽松规则集（E4/E7/E9/F），保证 Python 3.8 兼容的基本卫生。
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint
        run: ruff check .
