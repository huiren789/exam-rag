[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "examrag"
version = "0.1.0"
description = "ExamRAG — 有据可依的课程复习搭档：零依赖、可溯源的命令行 RAG 工具，已有 11 位同学体验使用"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = []
authors = [{ name = "huiren789" }]

[project.scripts]
examrag = "examrag.cli:main"

[tool.setuptools]
packages = ["examrag"]
