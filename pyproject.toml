[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "examrag"
version = "0.5.2"
description = "ExamRAG — 有据可依的课程复习搭档：可溯源的课程 RAG 工具，命令行 + 可选 HTTP API，核心零依赖"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = []
authors = [{ name = "huiren789" }]
keywords = ["rag", "retrieval", "llm", "education", "exam", "study", "chinese"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/huiren789/exam-rag"
Repository = "https://github.com/huiren789/exam-rag"
Issues = "https://github.com/huiren789/exam-rag/issues"
Changelog = "https://github.com/huiren789/exam-rag/releases"

# 核心 CLI 零依赖；只有需要 HTTP API 时才安装这一组。
[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.20", "httpx>=0.24"]
vector = ["sentence-transformers>=2.2"]

[project.scripts]
examrag = "examrag.cli:main"
examrag-web = "examrag.web:main"
examrag-evaluate = "examrag.evaluate:main"

[tool.setuptools]
packages = ["examrag"]

[tool.setuptools.package-data]
examrag = ["static/*"]

# 静态检查：宽松规则集，只挡真问题（语法/未定义名/未使用导入等）。
[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# retrieval.py 保留旧导入路径的兼容导出，tests 里部分导入作共享参考。
"examrag/retrieval.py" = ["F401"]
"tests/*" = ["F401"]
